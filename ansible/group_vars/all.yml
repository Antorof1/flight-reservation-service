---
app_dir: "/opt/flight-reservation-service"
is_demo: "{{ lookup('env', 'IS_DEMO') | default('false', true) | bool }}"

postgres_user: "{{ lookup('env', 'POSTGRES_USER') | default('db_user', true) }}"
postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
postgres_db: "{{ lookup('env', 'POSTGRES_DB') | default('flight_reservation_db', true) }}"

valkey_password: "{{ lookup('env', 'VALKEY_PASSWORD') }}"

rabbitmq_user: "{{ lookup('env', 'RABBITMQ_USER') | default('rabbitmq_user', true) }}"
rabbitmq_password: "{{ lookup('env', 'RABBITMQ_PASSWORD') }}"

jwt_secret_key: "{{ lookup('env', 'JWT_SECRET_KEY') }}"

resend_api_key: "{{ lookup('env', 'RESEND_API_KEY') }}"
resend_from_email: "{{ lookup('env', 'RESEND_FROM_EMAIL') }}"
notifications_mode: "{{ lookup('env', 'NOTIFICATIONS_MODE') | default('OFF', true) }}"
notifications_allowlist: "{{ lookup('env', 'NOTIFICATIONS_ALLOWLIST') | default('', true) }}"

seed_admin_email: "{{ lookup('env', 'SEED_ADMIN_EMAIL') | default('admin@demo.local', true) }}"
seed_admin_password: "{{ lookup('env', 'SEED_ADMIN_PASSWORD') }}"
spring_profiles_active: "{{ lookup('env', 'SPRING_PROFILES_ACTIVE') | default('prod', true) }}"

app_image_tag: "{{ lookup('env', 'APP_IMAGE_TAG') | default('latest', true) }}"

domain: "{{ lookup('env', 'DOMAIN') | default('localhost', true) }}"
trusted_proxies: "{{ lookup('env', 'TRUSTED_PROXIES') | default('', true) }}"
tls_cert: "{{ lookup('env', 'TLS_CERT') | default('', true) }}"
tls_key: "{{ lookup('env', 'TLS_KEY') | default('', true) }}"

grafana_admin_user: "{{ lookup('env', 'GRAFANA_ADMIN_USER') | default('admin', true) }}"
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
