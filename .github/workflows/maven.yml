name: Java CI/CD with Maven and Docker

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Run tests with Maven
      run: ./mvnw clean test

  publish:
    name: Build and push Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha, format=long
          type=ref, event=branch
          latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha, mode=max

  deploy:
    name: Deploy to VPS
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run Ansible Playbook
      uses: dawidd6/action-ansible-playbook@v9
      env:
        DB_USER: ${{ vars.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_NAME: ${{ vars.DB_NAME }}
        VALKEY_PASSWORD: ${{ secrets.VALKEY_PASSWORD }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        SEED_ADMIN_EMAIL: ${{ vars.SEED_ADMIN_EMAIL }}
        SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE }}
        APP_IMAGE_TAG: ${{ vars.APP_IMAGE_TAG }}
        DOMAIN: ${{ vars.DOMAIN }}
        TRUSTED_PROXIES: ${{ vars.TRUSTED_PROXIES }}
        TLS_CERT: ${{ secrets.TLS_CERT }}
        TLS_KEY: ${{ secrets.TLS_KEY }}
        GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER }}
        GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        IS_DEMO: ${{ vars.IS_DEMO }}
      with:
        playbook: deploy.yml
        directory: ansible
        key: ${{ secrets.VPS_SSH_KEY }}
        inventory: |
          [prod]
          ${{ secrets.VPS_HOST }}
        options: |
          -u ${{ vars.VPS_USERNAME }}

