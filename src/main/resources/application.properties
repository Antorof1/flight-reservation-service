spring.application.name=flightreservationservice
spring.data.web.pageable.max-page-size=100
spring.docker.compose.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
management.endpoints.web.exposure.include=prometheus,health,info
management.metrics.tags.application=${spring.application.name}
management.server.port=8081
jwt.secret-key=${JWT_SECRET_KEY}
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}
app.seed-admin.email=${SEED_ADMIN_EMAIL:}
app.seed-admin.password=${SEED_ADMIN_PASSWORD:}
app.notifications.retry.max-retries=${NOTIFICATIONS_RETRY_MAX_RETRIES:2}
app.notifications.retry.delay=${NOTIFICATIONS_RETRY_DELAY:2s}
